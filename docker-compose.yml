services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_OPTIONAL_DEPS: ${INSTALL_OPTIONAL_DEPS:-0}
        INSTALL_FLYAI_CLI: ${INSTALL_FLYAI_CLI:-0}
    ports:
      - "8000:8000"
    volumes:
      - ./external/12306:/app/external/12306
      - ./external/flyai-1.0.15:/app/external/flyai:ro
    environment:
      DATABASE_URL: postgresql+asyncpg://travel:travel@postgres:5432/travel
      REDIS_URL: redis://redis:6379/0
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: "19530"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_MAX_TOKENS: ${EMBEDDING_MAX_TOKENS:-8192}
      EMBEDDING_CHUNK_MAX_TOKENS: ${EMBEDDING_CHUNK_MAX_TOKENS:-7000}
      RAG_KEYWORD_TOP_K: ${RAG_KEYWORD_TOP_K:-20}
      RAG_VECTOR_TOP_K: ${RAG_VECTOR_TOP_K:-20}
      RAG_RRF_K: ${RAG_RRF_K:-60}
      RAG_FUSED_TOP_K: ${RAG_FUSED_TOP_K:-20}
      RAG_FINAL_TOP_K: ${RAG_FINAL_TOP_K:-5}
      RAG_RERANKER_ENABLED: ${RAG_RERANKER_ENABLED:-false}
      RAG_RERANKER_MODEL: ${RAG_RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      KEYWORD_INDEX_REDIS_KEY: ${KEYWORD_INDEX_REDIS_KEY:-knowledge:keyword:chunks}
      TRAVEL_INVENTORY_PROVIDER: ${TRAVEL_INVENTORY_PROVIDER:-demo}
      AMADEUS_CLIENT_ID: ${AMADEUS_CLIENT_ID:-}
      AMADEUS_CLIENT_SECRET: ${AMADEUS_CLIENT_SECRET:-}
      AMADEUS_BASE_URL: ${AMADEUS_BASE_URL:-https://test.api.amadeus.com}
      FLYAI_CLI_BIN: ${FLYAI_CLI_BIN:-flyai}
      FLYAI_API_KEY: ${FLYAI_API_KEY:-}
      FLYAI_TIMEOUT_S: ${FLYAI_TIMEOUT_S:-45}
      TRAVEL_SEARCH_MAX_RESULTS: ${TRAVEL_SEARCH_MAX_RESULTS:-5}
      RAILWAY_12306_SKILL_DIR: ${RAILWAY_12306_SKILL_DIR-/app/external/12306}
      RAILWAY_12306_NODE_BIN: ${RAILWAY_12306_NODE_BIN:-node}
      RAILWAY_MCP_URL: ${RAILWAY_MCP_URL:-}
      RAILWAY_MCP_TIMEOUT_S: ${RAILWAY_MCP_TIMEOUT_S:-30}
      AGENT_ORCHESTRATOR_BACKEND: ${AGENT_ORCHESTRATOR_BACKEND:-langgraph}
      TRAVEL_VALIDATION_MAX_RETRIES: ${TRAVEL_VALIDATION_MAX_RETRIES:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
      POSTGRES_DB: travel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  etcd:
    image: milvusdb/etcd:3.5.5-r2
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    image: milvusdb/milvus:v2.4.6
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvusdata:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/19530'"]
      interval: 10s
      timeout: 10s
      retries: 20

volumes:
  pgdata:
  redisdata:
  milvusdata:
  etcd_data:
  minio_data:
